services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apex_dev_password
      POSTGRES_DB: apex_dev
    ports:
      - "5433:5432"
    volumes:
      - apex_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex -d apex_dev"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  apex_pg_data:
